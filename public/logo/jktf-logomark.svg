<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="JKTF">
  <title>JKTF</title>

  <!-- Top-left: J — black fill -->
  <rect x="1" y="1" width="57" height="57" fill="#000000"/>
  <text x="29" y="48" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="40" fill="#ffffff">J</text>

  <!-- Top-right: K — white fill, black border -->
  <rect x="62" y="1" width="57" height="57" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="90" y="48" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="40" fill="#000000">K</text>

  <!-- Bottom-left: T — white fill, black border -->
  <rect x="1" y="62" width="57" height="57" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="29" y="109" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="40" fill="#000000">T</text>

  <!-- Bottom-right: F — black fill -->
  <rect x="62" y="62" width="57" height="57" fill="#000000"/>
  <text x="90" y="109" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="40" fill="#ffffff">F</text>
</svg>
